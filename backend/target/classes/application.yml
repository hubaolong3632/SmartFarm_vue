spring:

  # 数据源配置
  datasource:
    url: jdbc:mysql://124.223.53.96:3306/greenhouse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: greenhouse_db
    password: iYDrDXFMThm5yks8
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # MyBatis-Plus配置
  sql:
    init:
      mode: never  # 不自动执行初始化脚本

  # Jackson配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always  # 改为 always，确保所有字段都序列化（包括 null 值）

---
# 服务器配置
server:
  port: 11000
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名转换
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志（已关闭）
  global-config:
    db-config:
      id-type: auto  # 主键自增
  type-aliases-package: com.greenhouse.entity  # 实体类包路径
  mapper-locations: classpath*:/mapper/**/*.xml  # Mapper XML文件位置（可选）

# EMQX MQTT 配置
emqx:
  broker-url: tcp://124.223.53.96:1883  # EMQX 服务器地址
  client-id: springboot  # 客户端ID（使用随机值避免冲突）
  username:  # MQTT 用户名（可选）
  password:  # MQTT 密码（可选）
  topic: text1  # 订阅的主题
  qos: 1  # 服务质量等级 (0, 1, 2)
  connection-timeout: 30  # 连接超时时间（秒）
  keep-alive-interval: 60  # 心跳间隔（秒）
  automatic-reconnect: true  # 自动重连

# 日志配置
logging:
  level:
    root: INFO
    com.greenhouse: DEBUG
    com.greenhouse.mapper: WARN  # 关闭Mapper的SQL查询日志
    org.springframework.web: INFO
    com.baomidou.mybatisplus: WARN  # 关闭MyBatis-Plus的详细日志
    org.apache.ibatis: WARN  # 关闭MyBatis的SQL日志
    org.eclipse.paho: INFO  # MQTT 客户端日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"