spring:
  application:
    name: greenhouse-api
  # 默认激活开发环境配置
  # 可以通过启动参数覆盖: java -jar app.jar --spring.profiles.active=prod
  profiles:
    active: dev
  # AI 配置
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: sk-951090b0c4c243a4a708d5e605205097
      chat:
        options:
          model: deepseek-chat

# 服务器配置
server:
  port: 10002
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 10MB  # 单个文件最大大小
      max-request-size: 50MB  # 请求最大大小

# 文件上传配置
file:
  upload:
    path: ./uploads/images  # 图片上传路径（相对于项目根目录）
    url-prefix: /api/images/files/  # 图片访问URL前缀

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名转换
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志（已关闭）
  global-config:
    db-config:
      id-type: auto  # 主键自增
  type-aliases-package: com.greenhouse.entity  # 实体类包路径
  mapper-locations: classpath*:/mapper/**/*.xml  # Mapper XML文件位置（可选）

# EMQX MQTT 配置
emqx:
  broker-url: tcp://mqtt.00000.work:1883  # EMQX 服务器地址
  client-id: springboot-3  # 客户端ID
  username:  # MQTT 用户名（可选）
  password:  # MQTT 密码（可选）
  topic: text1  # 订阅的主题
  qos: 1  # 服务质量等级 (0, 1, 2)
  connection-timeout: 30  # 连接超时时间（秒）
  keep-alive-interval: 60  # 心跳间隔（秒）
  automatic-reconnect: true  # 自动重连

# 日志配置
logging:
  level:
    root: INFO
    com.greenhouse: DEBUG
    com.greenhouse.mapper: WARN  # 关闭Mapper的SQL查询日志
    org.springframework.web: INFO
    com.baomidou.mybatisplus: WARN  # 关闭MyBatis-Plus的详细日志
    org.apache.ibatis: WARN  # 关闭MyBatis的SQL日志
    org.eclipse.paho: INFO  # MQTT 客户端日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"